# Prove automatiche: a ogni push e a ogni pull request esegue tutte le prove (vedi CLAUDE.md, «Come verificare»), senza saltarne nessuna:
#  - PostgreSQL DI PROVA creato qui, con SSL come Neon (api/_db.js si collega solo con SSL): mai il database di produzione;
#  - confronto del tracciato Alloggiati con il modulo originale del sito (repository pubblico SpaceEstate/LaColumbera).
# Nessuna variabile segreta e nessun servizio reale (Stripe, Google, email sono finti). Non tocca il sito, GitHub Pages né Vercel.
name: Prove

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Sito La Columbera (solo per il confronto del modulo Alloggiati)
        uses: actions/checkout@v5
        with:
          repository: SpaceEstate/LaColumbera
          path: _lacolumbera

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: PostgreSQL di prova con SSL
        run: |
          sudo systemctl start postgresql.service
          DATI=$(sudo -u postgres psql -tAc "SHOW data_directory")
          sudo openssl req -new -x509 -days 2 -nodes -subj "/CN=localhost" -keyout "$DATI/prova.key" -out "$DATI/prova.crt"
          sudo chown postgres:postgres "$DATI/prova.key" "$DATI/prova.crt"
          sudo chmod 600 "$DATI/prova.key"
          sudo -u postgres psql -c "ALTER SYSTEM SET ssl = on" -c "ALTER SYSTEM SET ssl_cert_file = '$DATI/prova.crt'" -c "ALTER SYSTEM SET ssl_key_file = '$DATI/prova.key'"
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres'"
          sudo systemctl restart postgresql.service
          sudo -u postgres psql -c "CREATE DATABASE checkin_test"
          test "$(sudo -u postgres psql -tAc 'SHOW ssl')" = "on"

      - name: Librerie (versioni di api/package-lock.json)
        working-directory: api
        run: npm ci --no-audit --no-fund

      - name: Prove
        working-directory: api
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/checkin_test
          LACOLUMBERA_DIR: ${{ github.workspace }}/_lacolumbera
        run: |
          set -o pipefail
          npm test | tee /tmp/prove.txt
          # qui ogni prova deve girare: una prova saltata vuol dire che manca il database o il confronto
          grep -q "^# skipped 0$" /tmp/prove.txt || { echo "::error::alcune prove sono state saltate"; exit 1; }

  # Scansione facoltativa dei documenti (docs/scansione-documenti.md): prove con un browser vero (Chromium), OCR vero con i file
  # del sito, documenti SINTETICI (tests/browser/documenti-sintetici) e API del check-in finte. Nessuna rete verso servizi reali.
  # Playwright si installa fuori dal repository: il progetto non ha nuove dipendenze.
  scansione:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Playwright e Chromium (fuori dal repository)
        run: |
          npm install --prefix /tmp/pw --no-audit --no-fund playwright@1.63.0
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium

      - name: Prove della scansione nel browser
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: |
          set -o pipefail
          node --test tests/browser/scansione.browser.cjs | tee /tmp/prove-browser.txt
          grep -q "^# skipped 0$" /tmp/prove-browser.txt || { echo "::error::alcune prove della scansione sono state saltate"; exit 1; }
